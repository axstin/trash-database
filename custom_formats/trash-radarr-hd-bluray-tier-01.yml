name: '[TRaSH] [Radarr] HD Bluray Tier 01'
description: '**Imported from radarr/hd-bluray-tier-01**


  Groups that:


  - Have established themselves as consistently delivering high-quality releases.

  - Use remuxes as their source without micro-sizing them.

  - If Movies => Have a minimum of GP releases. (best encodes in their class 1080p
  and lower)

  - Follow the [Contributing General Guidelines](https://github.com/TRaSH-Guides/Guides/blob/master/CONTRIBUTING.md#general-guidelines){:target="_blank"
  rel="noopener noreferrer"}.'
tags:
