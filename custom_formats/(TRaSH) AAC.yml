name: '[TRaSH] AAC'
description: '**Imported from sonarr/aac**


  [From Wikipedia, the free encyclopedia](https://en.wikipedia.org/wiki/Advanced_Audio_Coding){:target="\_blank"
  rel="noopener noreferrer"}

  Advanced Audio Coding (AAC) is an audio coding standard for lossy digital audio
  compression. Designed to be the successor of the MP3 format, AAC generally achieves
  higher sound quality than MP3 at the same bit rate.'
