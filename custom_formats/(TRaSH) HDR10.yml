name: '[TRaSH] HDR10'
description: '**Imported from sonarr/hdr10**


  HDR10 is the most basic HDR format used in consumer media and is supported by all
  HDR-supported devices.


  HDR10 relies on static metadata which limits its effect to a per-movie or per-episode
  basis. Because of this, it lacks the information for how the content should be adjusted
  for your specific display. The interaction between display capabilities, video metadata,
  and the ultimate output (i.e., the presentation of the video) is controlled by the
  display, which may result in quality that is ultimately not how was originally intended.'
tags:
- TRaSH
- HDR10
