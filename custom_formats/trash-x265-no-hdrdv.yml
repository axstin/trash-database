name: '[TRaSH] x265 (no HDR/DV)'
description: "**Imported from sonarr/x265-no-hdrdv**\n\nThis blocks most 720/1080p\
  \ (HD) releases that are encoded in x265, **But it will allow 720/1080p x265 releases\
  \ if they have HDR and/or DV**\n\n*Since some NF releases won't be released as 4k,\
  \ this allows you to still have the DV/HDR releases.*\n\nIn your quality profile\
  \ use the following score for this Custom Format: `{{ sonarr['cf']['x265-no-hdrdv']['trash_scores']['default']\
  \ }}`\n\n??? question \"Why block 720/1080p encodes in x265? - [Click to show/hide]\"\
  \n\n    --8<-- \"includes/docker/x265.md\"\n\n{! include-markdown \"../../includes/cf-descriptions/x265-no-hdrdv-sonarr-warning.md\"\
  \ !}"
tags:
- TRaSH
- x265 (no HDR/DV)
conditions:
- name: x265/HEVC
  negate: false
  required: true
  type: release_title
  pattern: x|h265
- name: Not HDR/DV
  negate: true
  required: true
  type: release_title
  pattern: HDR/DV
- name: Not 2160p
  negate: true
  required: true
  type: resolution
  resolution: 2160p
