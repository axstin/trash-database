name: '[TRaSH] [Radarr] PQ'
description: '**Imported from radarr/pq**


  PQ (perceptual quantizer) or PQ10 is the most basic HDR format that can be used
  for both video and still images. It is the same as the HDR10 format without any
  metadata.


  You will find this mainly with older movies.'
