name: '[TRaSH] German'
description: '**Imported from sonarr/language-german**


  This custom format helps Radarr/Sonarr recognize German audio releases that contain
  only a German language track and no others. It will add `German` to your filename.'
tags:
- TRaSH
- German
tests: []
conditions:
- name: German
  negate: false
  required: true
  type: language
  language: german
- name: NOT Original
  negate: true
  required: true
  type: language
  language: original
- name: DL
  negate: true
  required: true
  type: release_title
  pattern: '[TRaSH] DL'
- name: Not Subbed
  negate: true
  required: true
  type: release_title
  pattern: '[TRaSH] Subbed'
