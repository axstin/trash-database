name: '[TRaSH] [Radarr] x264'
description: '**Imported from radarr/x264**


  x264 is a *free software library* and *application* for encoding video streams into
  the [H.264/MPEG-4 AVC](https://en.wikipedia.org/wiki/H.264){:target="_blank" rel="noopener
  noreferrer"} compression format, and is released under the terms of the [GNU GPL](https://www.gnu.org/licenses/old-licenses/gpl-2.0.html){:target="_blank"
  rel="noopener noreferrer"}.


  x264 is primarily used for 720p/1080p encodes and has better direct-play and compatibility
  support.'
tags:
- TRaSH
- x264
- TRaSH Radarr
