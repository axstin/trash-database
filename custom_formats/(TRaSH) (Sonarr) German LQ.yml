name: '[TRaSH] [Sonarr] German LQ'
description: "**Imported from sonarr/german-lq**\n\nA collection of known German Low-Quality\
  \ groups that are often banned from the top trackers due to their lack of quality.\n\
  \n!!! note\n\n    - Ads/Watermarks = Groups that are known to put ads or watermarks\
  \ in their releases.\n    - Bad/False releases = Groups that are known for lying\
  \ about their quality, type, or the name of their releases.\n    - DeTAG/ReTAG =\
  \ Detagging or stealing groups.\n    - Other reasons = Group is banned on top tier\
  \ trackers or is generally known for poor quality/errors."
tags:
- TRaSH
- German LQ
- TRaSH Sonarr
