- name: NOT Original Language
  negate: true
  required: true
  type: language
  language: original
- name: German
  negate: false
  required: true
  type: language
  language: german
- name: DL
  negate: false
  required: false
  type: release_title
  pattern: DL
- name: ML
  negate: false
  required: false
