name: '[TRaSH] VOSTFR'
description: '**Imported from sonarr/french-vostfr**


  Indicates soundtrack in the original language, with French subtitles. It should
  be noted that SUBFRENCH is included inside this Custom Format. However, SUB often
  means that the subtitle was embedded inside the picture (hardcoded). French releases
  tend to mix both, leading to some VOSTFR being labeled as SUBFRENCH and SUBFRENCH
  as VOSTFR.'
